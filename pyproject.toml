[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modbus-bridge"
version = "0.0.1"
description = "A bridge for Modbus TCP energy devices: SunSpec and raw register maps, with quirks as data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modbus_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
