[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modbus-bridge"
version = "0.0.1"
description = "A bridge for Modbus TCP energy devices: SunSpec and raw register maps, with quirks as data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "modbus-connection[tmodbus]>=4.12.7,<5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "openpyxl",  # scripts/convert_pics.py only
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modbus_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by scripts/generate_sunspec_models.py; kept exactly as generated.
extend-exclude = ["src/modbus_bridge/sunspec_models/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
